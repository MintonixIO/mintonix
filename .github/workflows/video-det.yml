name: Video Detection Worker

on:
  push:
    branches: [master]
    paths:
      - "workers/vast/video-det/**"
      - ".github/workflows/video-det.yml"
      - ".github/workflows/vast-worker.yml"
  pull_request:
    paths:
      - "workers/vast/video-det/**"
      - ".github/workflows/video-det.yml"
      - ".github/workflows/vast-worker.yml"

concurrency:
  group: video-det-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/vast-worker.yml
    permissions:
      contents: read
      packages: write
    # Model bake uses match-data naming:
    #   vars.SUPABASE_PROJECT_REF (via vast-worker environment) → SUPABASE_URL
    #   secrets.SUPABASE_SERVICE_KEY → x-pipeline-token for ops/model-urls
    # Reusable workflows must receive secrets explicitly from the caller.
    secrets:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    with:
      directory: workers/vast/video-det
      image: video-det
      # The TensorRT base image is ~9 GB; reclaim runner disk first.
      free_disk_space: true
      # MANIFEST-listed weights via Cloudflare data plane (free B2→CF egress).
      fetch_models: true
      # No GPU on CI runners: TensorRT engine *build* and real inference stay
      # manual. Import + unit tests still catch API drift. CUDA stub for imports.
      # Bake verification checks /app/models on disk; unit tests must NOT load
      # those engines (TRT deserialize segfaults without a GPU — exit 139).
      # Point model env at missing paths + ALLOW_MISSING_MODELS so lifespan
      # stays unloaded while still asserting 503/import contracts.
      docker_run_args: >-
        -e ALLOW_MISSING_MODELS=1
        -e POSE_ENGINE=/nonexistent/pose.engine
        -e SHUTTLE_CKPT=/nonexistent/shuttle.pt
        -e SHUTTLE_ENGINE=
      test_command: >-
        bash -c "ln -s /usr/local/cuda/lib64/stubs/libcuda.so
        /usr/local/lib/libcuda.so.1 && ldconfig &&
        test -f /app/models/MANIFEST.json &&
        python3 -c 'import json; from pathlib import Path;
        m=json.loads(Path(\"/app/models/MANIFEST.json\").read_text());
        missing=[f[\"name\"] for f in m[\"files\"] if not (Path(\"/app/models\")/f[\"name\"]).is_file()];
        assert not missing, missing;
        print(\"baked models ok\", [f[\"name\"] for f in m[\"files\"]])' &&
        python3 -c 'import server, worker, detect' &&
        python3 -m unittest discover -p 'test_*.py' -v"
