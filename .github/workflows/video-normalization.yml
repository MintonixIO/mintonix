name: Video Normalization Worker

on:
  push:
    branches:
      - master
    paths:
      - "workers/vast/video-normalization/**"
  pull_request:
    paths:
      - "workers/vast/video-normalization/**"

jobs:
  staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: workers/vast/video-normalization
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/video-normalization
          IMAGE=${IMAGE,,}
          docker build -t video-normalization -t $IMAGE:staging .

      - name: Test
        # REQUIRE_GPU=0: the image defaults to GPU-required, but this runner has
        # no GPU and the e2e test exercises the CPU (libx264) path.
        run: docker run --rm -e REQUIRE_GPU=0 video-normalization python -m unittest test_handler -v

      - name: Push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/video-normalization
          IMAGE=${IMAGE,,}
          docker push $IMAGE:staging

  prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: workers/vast/video-normalization
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/video-normalization
          IMAGE=${IMAGE,,}
          docker build -t video-normalization -t $IMAGE:latest .

      - name: Test
        # REQUIRE_GPU=0: the image defaults to GPU-required, but this runner has
        # no GPU and the e2e test exercises the CPU (libx264) path.
        run: docker run --rm -e REQUIRE_GPU=0 video-normalization python -m unittest test_handler -v

      - name: Push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/video-normalization
          IMAGE=${IMAGE,,}
          docker push $IMAGE:latest
