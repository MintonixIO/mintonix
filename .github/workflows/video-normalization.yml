name: Video Normalization Worker

on:
  push:
    branches: [master]
    paths:
      - "workers/vast/video-normalization/**"
      - ".github/workflows/video-normalization.yml"
      - ".github/workflows/vast-worker.yml"
  pull_request:
    paths:
      - "workers/vast/video-normalization/**"
      - ".github/workflows/video-normalization.yml"
      - ".github/workflows/vast-worker.yml"

concurrency:
  group: video-normalization-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/vast-worker.yml
    permissions:
      contents: read
      packages: write
    with:
      directory: workers/vast/video-normalization
      image: video-normalization
      # Transcode is GPU-only and CI runners have no GPU: the transcode e2e
      # tests self-skip, leaving the contract/unit tests plus the remux-path
      # e2e (which needs no GPU) to validate the image.
      # Suite lives in test_*.py (test_handler.py was split); discover matches local README.
      test_command: python -m unittest discover -v -s . -p 'test_*.py'
