name: Match data — scrape & load to Supabase

on:
  schedule:
    # Weekly, Sunday 09:00 UTC
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      historical:
        description: Rescrape all World Tour years (2018–current) to backfill match_date
        type: boolean
        default: false
  pull_request:
    paths:
      - "workers/github/match-data/**"
      - ".github/workflows/match-data.yml"
  push:
    branches: [master]
    paths:
      - "workers/github/match-data/**"
      - ".github/workflows/match-data.yml"

# Serialize runs that touch the same database (push to master + schedule share
# the master ref), but give each PR its own group and let a newer push cancel an
# in-flight PR run. Never cancel an applying run on master.
concurrency:
  group: match-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: workers/github/match-data

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    # PR → dev (apply); push to master / schedule / manual → prod (apply).
    # Each environment supplies vars.SUPABASE_PROJECT_REF (from which the API
    # URL is derived) + secrets.SUPABASE_SERVICE_KEY.
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/github/match-data/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python3 -m unittest test_scraper_cli.py test_scraper_dates.py test_scraper_results.py test_fetch_cache.py test_load_purge.py test_ratings.py -v

      # 1. Scrape current season, or every World Tour year when dispatched
      #    with historical=true (one-shot date backfill after the infobox parser).
      - name: Scrape BWF results
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.historical }}" = "true" ]; then
            echo "Historical backfill: scraping 2018–current"
            ./load_historical_years.sh --scrape-only
          else
            python3 scraper.py
          fi

      # 2. Fetch BWF channel video metadata (offline-friendly producer)
      - name: Fetch YouTube video metadata
        run: python3 fetch_bwf_videos.py flat

      # 3. Match videos to matches — pure local transform, no DB
      - name: Match videos to matches
        run: python3 find_youtube_videos.py --videos-file bwf_videos.json

      # 4. Load to Supabase (always apply). PR → dev; master/schedule/manual → prod.
      #    Log is mirrored to the run summary.
      - name: Load to Supabase
        env:
          # Derived from the project ref (the single source of truth shared
          # with supabase.yml) so the two can never drift and silently point
          # this loader at a different project. Revisit only if the API ever
          # moves behind a custom domain.
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "### Match-data load (applied to dev)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Match-data load (applied to prod)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in bwf_*_results.json; do
            echo "Loading $f ..." | tee -a "$GITHUB_STEP_SUMMARY"
            python3 load_to_supabase.py --json-file "$f" --videos-file video_matches.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 5. Recompute Glicko-2 / TrueSkill form ratings from the full catalog.
      - name: Compute form ratings
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -eo pipefail
          echo "### Form ratings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 compute_ratings.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 6. Keep the run's artifacts for debugging (data lives in Supabase)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-data
          path: |
            workers/github/match-data/bwf_*_results.json
            workers/github/match-data/bwf_videos.json
            workers/github/match-data/video_matches.json
          if-no-files-found: warn
          retention-days: 14
