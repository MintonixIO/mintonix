name: Video Preprocess Worker

on:
  push:
    branches: [master]
    paths:
      - "workers/vast/video-preprocess/**"
      - ".github/workflows/video-preprocess.yml"
      - ".github/workflows/vast-worker.yml"
  pull_request:
    paths:
      - "workers/vast/video-preprocess/**"
      - ".github/workflows/video-preprocess.yml"
      - ".github/workflows/vast-worker.yml"

concurrency:
  group: video-preprocess-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/vast-worker.yml
    permissions:
      contents: read
      packages: write
    secrets:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    with:
      directory: workers/vast/video-preprocess
      image: video-preprocess
      free_disk_space: true
      fetch_models: true
      docker_run_args: >-
        -e ALLOW_MISSING_MODELS=1
        -e POSE_ENGINE=/nonexistent/pose.engine
        -e SHUTTLE_ENGINE=/nonexistent/shuttle.engine
      test_command: >-
        bash -c "export LD_LIBRARY_PATH=/opt/cuda-stubs:/usr/local/cuda/lib64/stubs:/usr/local/cuda/compat:\${LD_LIBRARY_PATH} &&
        /opt/worker-env/bin/python /app/tools/check_trt_runtime.py &&
        /opt/worker-env/bin/python -c 'import tensorrt as trt; print(\"ci_trt\", trt.__version__); assert trt.__version__ and not trt.__version__.startswith(\"0.0\")' &&
        ldd /usr/local/lib/trt/libnvinfer.so* | tee /tmp/ldd.txt &&
        if grep \"not found\" /tmp/ldd.txt | grep -vE 'libcuda\\.so|libnvidia-' | grep -q .; then echo FAIL ldd; cat /tmp/ldd.txt; exit 1; fi &&
        test -f /app/models/MANIFEST.json &&
        /opt/worker-env/bin/python -c 'import json; from pathlib import Path;
        m=json.loads(Path(\"/app/models/MANIFEST.json\").read_text());
        missing=[f[\"name\"] for f in m[\"files\"] if not (Path(\"/app/models\")/f[\"name\"]).is_file()];
        assert not missing, missing;
        print(\"baked models ok\", [f[\"name\"] for f in m[\"files\"]])' &&
        /opt/worker-env/bin/python -c 'from distutils.util import strtobool; import server, worker, detect; assert callable(worker.BenchmarkConfig), worker.BenchmarkConfig' &&
        /opt/worker-env/bin/python -m unittest discover -v -s . -p 'test_*.py'"
