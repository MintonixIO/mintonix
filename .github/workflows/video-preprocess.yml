name: Video Preprocess Worker

on:
  push:
    branches: [master]
    paths:
      - "workers/vast/video-preprocess/**"
      - ".github/workflows/video-preprocess.yml"
      - ".github/workflows/vast-worker.yml"
  pull_request:
    paths:
      - "workers/vast/video-preprocess/**"
      - ".github/workflows/video-preprocess.yml"
      - ".github/workflows/vast-worker.yml"

concurrency:
  group: video-preprocess-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/vast-worker.yml
    permissions:
      contents: read
      packages: write
    with:
      directory: workers/vast/video-preprocess
      image: video-preprocess
      # Transcode/detect are GPU-only and CI runners have no GPU: unit/contract
      # tests in the image validate the package; full encode e2e runs on vast.
      # Deps live in the image venv (/opt/worker-env), not system python.
      test_command: /opt/worker-env/bin/python -m unittest discover -v -s . -p 'test_*.py'
