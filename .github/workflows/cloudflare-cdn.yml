name: Cloudflare CDN Worker

on:
  push:
    branches:
      - master
    paths:
      - "workers/cloudflare/cdn/**"
  pull_request:
    paths:
      - "workers/cloudflare/cdn/**"

# Don't let two pushes to the same ref deploy the same Worker concurrently; a
# newer PR commit cancels an in-flight PR run, but never cancel a master deploy.
concurrency:
  group: cloudflare-cdn-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: workers/cloudflare/cdn

jobs:
  deploy:
    runs-on: ubuntu-latest
    # PR  -> deploy the `dev` Worker (mintonix-cdn-dev, dev bucket) for testing.
    # push to master -> deploy the `prod` Worker (mintonix-cdn, prod bucket).
    # CLOUDFLARE_API_TOKEN / _ACCOUNT_ID come from the matching GitHub
    # Environment (or repo secrets); B2 keys live ON the Worker via
    # `wrangler secret put` and are NOT needed here.
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    permissions:
      contents: read
    env:
      WRANGLER_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: workers/cloudflare/cdn/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy (${{ env.WRANGLER_ENV }})
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
